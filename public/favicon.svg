  <!-- Creator Forge 4-Node Catalyst Mark -->
  <!-- Node 1: Creator (Base Anchor) -->
  <rect x="5.5" y="17" width="9" height="9" rx="2" fill="#F8FAFC"/>
  <!-- Node 2: Audience Signal (Elevation) -->
  <rect x="5.5" y="6" width="9" height="9" rx="2" fill="#94A3B8" fill-opacity="0.85"/>
  <!-- Node 3: Software Product (Core) -->
  <rect x="17.5" y="6" width="9" height="9" rx="2" fill="#F8FAFC"/>
  <!-- Node 4: Catalyst Spark (Electric Lime / Emerald) -->
